# Builds the macOS DMG for a version tag (v0.1.0) and attaches it to a draft GitHub release.
# Publish the release by hand. The app has an ad-hoc signature and is not notarized, so macOS
# asks the user to allow it on the first open (see llms-install.md).
name: Release macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: jdx/mise-action@v5
      - name: Check that the tag is the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME, but tauri.conf.json has $version"; exit 1; }
      # One DMG for Apple Silicon and Intel Macs.
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin --bundles dmg
      - name: Attach the DMG to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes "${dmg[@]}" \
            || gh release upload "$GITHUB_REF_NAME" --clobber "${dmg[@]}"
