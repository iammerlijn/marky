# The Rust crate has macOS-only code (the menu bar, "Open With"). Only cargo test: macOS
# runner minutes cost 10 times more on a private repository.
# A separate workflow, because a path filter cannot apply to one job. It runs on each push to
# main, and on a pull request only when it changes the Rust code, the Rust version (mise.toml)
# or this file.
name: CI macOS

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/README.md']
  pull_request:
    paths: ['src-tauri/**', 'mise.toml', '.github/workflows/ci-macos.yml']

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-macos-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test
        working-directory: src-tauri
