# Tests at each commit, on Linux and macOS.
name: CI

# Push only for main: a pull request runs the jobs for its branch, so they do not run twice.
# A change to only the docs, a README, the issue forms or the license does not run CI. Other .md
# files are test input (tests/corpus, dev/sample.md), so they still run it.
# workflow_dispatch: start all jobs by hand, also the release build, for example on a branch.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/README.md', '.github/ISSUE_TEMPLATE/**', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', '**/README.md', '.github/ISSUE_TEMPLATE/**', 'LICENSE']
  workflow_dispatch:

# A new commit on a pull request stops the run of the previous commit. Runs on main all finish,
# each in its own group: a merge does not wait for the run of the merge before it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      # The .deb files come from a cache: a slow Ubuntu mirror made the download take 3 minutes.
      # apt downloads only the packages that are not in the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ github.job }}
      - name: Install the system libraries of Tauri
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # apt makes root-owned files there. The cache can save only the files that it can read.
          sudo chown -R "$USER" ~/apt-archives
      # Only main saves the caches. A pull request reads the cache of main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The cache keeps the downloads of npm, not node_modules: npm ci makes a new node_modules
      # from the lockfile at each run, and checks each package against it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: dev/check-size.sh
      - run: cargo test
        working-directory: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

  # Advisories of the dependencies. The policy:
  # - An advisory for a production npm package fails the job.
  # - The full npm audit also shows the development packages. It does not fail the job.
  # - cargo audit fails for a vulnerability. Unmaintained and unsound notices are warnings only.
  # - An advisory on the ignore list does not fail the job. Each one needs a reason and an issue.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: npm audit --omit=dev --audit-level=low
      # Issue #54: 14 moderate advisories in the WebdriverIO chain (development only).
      - run: npm audit
        continue-on-error: true
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-audit@0.23.0
      # The ignore list. RUSTSEC-2024-0429: glib 0.18 in the GTK stack of Tauri, issue #54.
      - run: cargo audit --ignore RUSTSEC-2024-0429
        working-directory: src-tauri

  visual:
    runs-on: ubuntu-latest
    # The same image as `npm run test:visual`, so the approved screenshots match.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      # The Node.js of the image, not of mise.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright test
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-differences
          path: test-results

  e2e:
    # App tests in a real window (tests/e2e). tauri-driver needs WebKitWebDriver: Linux only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ github.job }}
      - name: Install the system libraries, WebKitWebDriver and a virtual display
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkitgtk-webdriver xvfb dbus
          sudo chown -R "$USER" ~/apt-archives
      # The cache also keeps ~/.cargo/bin, so cargo install skips tauri-driver when it is there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install tauri-driver --locked
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      # The single-instance plugin needs a D-Bus session.
      - run: dbus-run-session -- xvfb-run --auto-servernum npm run test:e2e

  # The release packages. Only main and a start by hand need them, and they are the slowest jobs.
  # On a pull request, the e2e job already compiles the app.
  build:
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ github.job }}
      - if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo chown -R "$USER" ~/apt-archives
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marky-${{ matrix.bundles }}
          path: src-tauri/target/release/bundle/${{ matrix.bundles }}/*
